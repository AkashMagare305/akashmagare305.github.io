<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Gemini AI Search Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 800px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 26px; color: #38bdf8; margin-bottom: 5px; }
        header p { color: #94a3b8; font-size: 14px; }

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        button {
            padding: 14px 24px; border: none; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #0284c7); color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }

        .loading { display: none; text-align: center; color: #f59e0b; font-weight: bold; margin: 15px 0; font-size: 16px; }
        
        /* Result Styling */
        .result-box { display: none; margin-top: 20px; padding: 20px; background: #0f172a; border-radius: 12px; border-left: 5px solid #38bdf8; line-height: 1.7; font-size: 15px; }
        
        /* Image Gallery Styling */
        .image-container { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px; justify-content: center; }
        .image-card { width: 100%; max-width: 320px; border-radius: 10px; overflow: hidden; border: 1px solid #334155; background: #1e293b; }
        .image-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
        .image-card p { padding: 8px; font-size: 12px; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🤖 Universal Gemini AI Search</h1>
            <p>Kuch bhi poochhein — Industrial, Science, Tech ya General Knowledge! (Images ke sath)</p>
        </header>

        <div class="input-group">
            <input type="password" id="apiKey" placeholder="🔑 Enter Gemini API Key (aistudio.google.com)">
            <input type="text" id="userQuery" placeholder="🔍 Poochhein (jaise: EV Scooter working with image, Paint Defects, Taj Mahal, 5S system)">
            <button onclick="processQuery()">Search & Generate</button>
        </div>

        <div class="loading" id="loading">⏳ Gemini AI jawab aur images dhoond raha hai...</div>

        <div class="result-box" id="resultBox">
            <div id="textAnswer"></div>
            <div class="image-container" id="imageGallery"></div>
        </div>
    </div>

    <script>
        async function processQuery() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const query = document.getElementById('userQuery').value.trim();
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const textAnswer = document.getElementById('textAnswer');
            const imageGallery = document.getElementById('imageGallery');

            if (!apiKey) {
                alert('Kripya pehle apni Gemini API Key daalein!');
                return;
            }
            if (!query) {
                alert('Kripya search karne ke liye sawal likhein!');
                return;
            }

            loading.style.display = 'block';
            resultBox.style.display = 'none';
            imageGallery.innerHTML = '';
            textAnswer.innerHTML = '';

            try {
                // Step 1: Call Gemini API with Google Search Grounding
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Aap ek highly intelligent AI assistant hain. User ke is sawal ka detail aur aasan Hindi/Hinglish me jawab dein: "${query}". Format text with bold headings and clean bullet points.`
                            }]
                        }],
                        tools: [{ googleSearch: {} }] // Live Google Search Integration
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let text = data.candidates[0].content.parts[0].text;
                    // Format basic markdown style text
                    text = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    textAnswer.innerHTML = text;
                    resultBox.style.display = 'block';

                    // Step 2: Fetch Relevant Images automatically if asked or applicable
                    fetchImages(query);
                } else {
                    textAnswer.innerHTML = "Koi jawab nahi mil saka. Kripya API Key check karein.";
                    resultBox.style.display = 'block';
                }

            } catch (err) {
                loading.style.display = 'none';
                textAnswer.innerHTML = "Error: " + err.message;
                resultBox.style.display = 'block';
            }
        }

        async function fetchImages(searchQuery) {
            const imageGallery = document.getElementById('imageGallery');
            try {
                // Free High Quality Image Search API (Unsplash)
                const cleanQuery = encodeURIComponent(searchQuery.replace(/image|photo|pic|dekhao|batao|with image/gi, '').trim());
                const imgRes = await fetch(`https://source.unsplash.com/featured/400x300/?${cleanQuery}`);
                
                if (imgRes.url) {
                    imageGallery.innerHTML = `
                        <div class="image-card">
                            <img src="${imgRes.url}" alt="Search Visual" onerror="this.style.display='none'">
                            <p>Visual representation for: ${searchQuery}</p>
                        </div>
                    `;
                }
            } catch (e) {
                console.log("Image load error:", e);
            }
        }
    </script>

</body>
</html>
